name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.8'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: npm run build:check
